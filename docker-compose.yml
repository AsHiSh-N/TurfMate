services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/turf.db
      JWT_SECRET: local-compose-only-secret-change-before-deploy
      FRONTEND_URL: http://localhost:3000
    volumes:
      - turf_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  turf_data:
